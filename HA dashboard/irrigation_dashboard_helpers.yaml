# ============================================================================
# Irrigation Dashboard — Helper Entities
# ============================================================================
# Add this to your Home Assistant configuration.yaml (or split into packages).
# After adding, restart HA, then configure via the dashboard's Config tab.
# ============================================================================

input_text:
  irrigation_device_id:
    name: "Irrigation Device ID"
    icon: mdi:identifier
    max: 64
    # Set to the Z2M entity prefix for your device.
    # Examples:
    #   "0xa0f262fffe45ceb0"        (IEEE address, default Z2M naming)
    #   "irrigation_controller"     (if you renamed the device in Z2M)
    # All dashboard entities are derived from this prefix:
    #   switch.{prefix}_ctrl_irr, sensor.{prefix}_status_cycle_state, etc.
    initial: ""

  # Zone friendly names — displayed in dashboard cards instead of "Zone 01", "Zone 02", etc.
  # Set these from the dashboard Config tab after selecting your device.
  irrigation_zone_1_name:
    name: "Zone 1 Name"
    icon: mdi:sprinkler-variant
    max: 32
    initial: "Zone 1"
  irrigation_zone_2_name:
    name: "Zone 2 Name"
    icon: mdi:sprinkler-variant
    max: 32
    initial: "Zone 2"
  irrigation_zone_3_name:
