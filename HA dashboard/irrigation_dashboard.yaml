# ============================================================================
# Irrigation Controller — Home Assistant Dashboard  (PART 1 of 2)
# Run assemble_dashboard.py to combine into irrigation_dashboard.yaml
# ============================================================================

button_card_templates:

  # nested +/- buttons used inside custom_fields
  t_nested_minus:
    icon: mdi:minus
    show_name: false
    show_state: false
    styles:
      card: [{padding: 4px}, {box-shadow: none}, {background: transparent}]
      icon: [{width: 16px}, {color: 'var(--primary-text-color)'}]

  t_nested_plus:
    icon: mdi:plus
    show_name: false
    show_state: false
    styles:
      card: [{padding: 4px}, {box-shadow: none}, {background: transparent}]
      icon: [{width: 16px}, {color: 'var(--primary-text-color)'}]

  # irrigation / short zone row — parent entity is enable switch
  # tap=toggle, hold=more-info (overridden per card), opacity when disabled
  t_irr_zone:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: toggle
    styles:
      card:
        - padding: 6px 8px
        - border-top: 1px dotted var(--divider-color)
        - opacity: |
            [[[ return (entity && entity.state === 'on') ? '1' : '0.4'; ]]]

      grid:
        - grid-template-areas: '"icon name . minus val plus"'
        - grid-template-columns: 28px 1fr 8px 32px auto 32px
        - align-items: center
      custom_fields:
        icon: [{justify-self: start}, {display: flex}, {align-items: center}]
        name: [{justify-self: start}, {font-size: 17px}, {overflow: hidden}, {text-overflow: ellipsis}, {white-space: nowrap}]
        minus: [{justify-self: center}]
        val: [{justify-self: center}, {min-width: 56px}, {text-align: center}, {display: flex}, {align-items: center}, {justify-content: center}]
        plus: [{justify-self: center}]

  # manual zone row — parent entity is ctrl_zone_NN, green tint when active
  t_manual_zone:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: toggle
    styles:
      card:
        - padding: 6px 8px
        - border-top: 1px dotted var(--divider-color)
        - background: |
            [[[ return (entity && entity.state === 'on') ? 'rgba(76,175,80,0.15)' : 'var(--card-background-color)'; ]]]

      grid:
        - grid-template-areas: '"icon name . minus val plus"'
        - grid-template-columns: 28px 1fr 8px 32px auto 32px
        - align-items: center
      custom_fields:
        icon: [{justify-self: start}, {display: flex}, {align-items: center}]
        name: [{justify-self: start}, {font-size: 17px}, {overflow: hidden}, {text-overflow: ellipsis}, {white-space: nowrap}]
        minus: [{justify-self: center}]
        val: [{justify-self: center}, {min-width: 56px}, {text-align: center}, {display: flex}, {align-items: center}, {justify-content: center}]
        plus: [{justify-self: center}]

  # config numeric row — same layout as zone rows
  t_config_row:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: more-info
    styles:
      card:
        - padding: 6px 8px
        - border-top: 1px dotted var(--divider-color)
        - box-shadow: none
      grid:
        - grid-template-areas: '"icon name . minus val plus"'
        - grid-template-columns: 28px 1fr 8px 32px auto 32px
        - align-items: center
      custom_fields:
        icon: [{justify-self: start}, {display: flex}, {align-items: center}]
        name: [{justify-self: start}, {font-size: 17px}, {overflow: hidden}, {text-overflow: ellipsis}, {white-space: nowrap}]
        minus: [{justify-self: center}]
        val: [{justify-self: center}, {min-width: 56px}, {text-align: center}, {display: flex}, {align-items: center}, {justify-content: center}]
        plus: [{justify-self: center}]

  # config toggle row — same grid as zone rows, custom_fields: icon/name/val
  t_config_toggle:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: toggle
    styles:
      card:
        - padding: 6px 8px
        - border-top: 1px dotted var(--divider-color)
        - box-shadow: none
      grid:
        - grid-template-areas: '"icon name . val ."'
        - grid-template-columns: 28px 1fr 8px auto 8px
        - align-items: center
      custom_fields:
        icon: [{justify-self: start}, {display: flex}, {align-items: center}]
        name: [{justify-self: start}, {font-size: 17px}, {overflow: hidden}, {text-overflow: ellipsis}, {white-space: nowrap}]
        val: [{justify-self: end}, {display: flex}, {align-items: center}]

  # config info row — same grid as zone rows, custom_fields: icon/name/val
  t_config_info:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: more-info
    styles:
      card:
        - padding: 6px 8px
        - border-top: 1px dotted var(--divider-color)
        - box-shadow: none
      grid:
        - grid-template-areas: '"icon name . val ."'
        - grid-template-columns: 28px 1fr 8px auto 8px
        - align-items: center
      custom_fields:
        icon: [{justify-self: start}, {display: flex}, {align-items: center}]
        name: [{justify-self: start}, {font-size: 17px}, {overflow: hidden}, {text-overflow: ellipsis}, {white-space: nowrap}]
        val: [{justify-self: end}, {display: flex}, {align-items: center}]

title: Irrigation
views:

  # ==========================================================================
  # TAB 1: DASHBOARD
  # ==========================================================================
  - title: Dashboard
    path: dashboard
    icon: mdi:sprinkler
    type: sections
    max_columns: 4
    sections:

      # -----------------------------------------------------------------------
      # CONTROL CENTER — inline styles (too unique for templates)
      # -----------------------------------------------------------------------
      - title: ""
        cards:

          # Status Header
          - type: custom:button-card
            name: Control Center
            show_icon: true
            show_name: true
            show_state: false
            icon: mdi:sprinkler-variant
            entity: >-
              [[[ return 'sensor.' + states['input_text.irrigation_device_id'].state + '_status_cycle_state' ]]]
            label: |
              [[[
                const dev = states['input_text.irrigation_device_id'].state;
                const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                const lo  = states['binary_sensor.' + dev + '_status_pump_lockout'];
                const pl  = states['binary_sensor.' + dev + '_status_power_loss'];
                const ft  = states['sensor.' + dev + '_status_fault'];
                const q   = states['sensor.' + dev + '_status_queue_state'];
                const irrSw = states['switch.' + dev + '_ctrl_irr'];
                const shSw  = states['switch.' + dev + '_ctrl_short'];
                const cs    = entity ? entity.state : 'none';
                const irrOn = irrSw && irrSw.state === 'on';
                const shOn  = shSw  && shSw.state  === 'on';
                const cycleRunning = (cs === 'irrigation' && irrOn) || (cs === 'short' && shOn);
                const activeZone = states['sensor.' + dev + '_status_active_zone'];
                const zoneNum = activeZone ? parseInt(activeZone.state) : 0;
                const manualOn = zoneNum > 0 && !cycleRunning;
                let status = 'Idle', sColor = 'var(--secondary-text-color)';
                if (ml && ml.state === 'on') {
                  status = 'Maintenance Mode'; sColor = 'var(--error-color, #F44336)';
                } else if (pl && pl.state === 'on') {
                  status = 'Power Loss'; sColor = 'var(--error-color, #F44336)';
                } else if (lo && lo.state === 'on') {
                  status = 'Lockout'; sColor = 'var(--warning-color, #FF9800)';
                } else if (cycleRunning) {
                  status = (cs === 'irrigation' ? 'Irrigation' : 'Short') + ' in Progress';
                  sColor = cs === 'irrigation' ? 'var(--info-color, #2196F3)' : 'var(--warning-color, #FF9800)';
                } else if (manualOn) {
                  const nameEnt = states['input_text.irrigation_zone_' + zoneNum + '_name'];
                  const zoneName = (nameEnt && nameEnt.state) ? nameEnt.state : 'Zone ' + zoneNum;
                  status = zoneName + ' in Progress'; sColor = 'var(--success-color, #4CAF50)';
                }
                const bad = ['none','unavailable','unknown','null',''];
                const hasQueue = q && q.state && !bad.includes(q.state);
                const hasFault = ft && ft.state && !bad.includes(ft.state);
                const qHtml = hasQueue
                  ? '<span style="display:inline-flex;align-items:center;gap:4px">'
                    + '<ha-icon icon="mdi:priority-low" style="--mdc-icon-size:16px;color:var(--primary-color)"></ha-icon>'
                    + '<span style="font-size:15px;color:var(--primary-color)">' + q.state + ' queued</span>'
                    + '</span>'
                  : '';
                const fHtml = hasFault
                  ? '<span style="display:inline-flex;align-items:center;gap:4px">'
                    + '<ha-icon icon="mdi:alert" style="--mdc-icon-size:16px;color:var(--error-color,#F44336)"></ha-icon>'
                    + '<span style="font-size:15px;font-weight:500;color:var(--error-color,#F44336)">' + ft.state + '</span>'
                    + '</span>'
                  : '';
                const line2 = (hasQueue || hasFault)
                  ? '<div style="display:flex;align-items:center;gap:12px;margin-top:2px">' + qHtml + fHtml + '</div>'
                  : '';
                return '<div style="width:100%">'
                  + '<div style="color:' + sColor + ';text-transform:capitalize">' + status + '</div>'
                  + line2 + '</div>';
              ]]]
            show_label: true
            extra_styles: |
              #label {
                display: block !important;
                width: 100% !important;
                text-align: left !important;
                justify-content: flex-start !important;
                align-items: flex-start !important;
              }
              #label > div {
                width: 100% !important;
                text-align: left !important;
              }
            styles:
              card:
                - padding: 12px 16px 8px
                - border-bottom: 1px solid var(--divider-color)
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 32px 1fr
                - grid-gap: 0 12px
              icon:
                - width: 28px
                - color: |
                    [[[
                      const dev = states['input_text.irrigation_device_id'].state;
                      const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                      const pl  = states['binary_sensor.' + dev + '_status_power_loss'];
                      if (ml && ml.state === 'on') return 'var(--error-color, #F44336)';
                      if (pl && pl.state === 'on') return 'var(--error-color, #F44336)';
                      const cs    = entity ? entity.state : 'none';
                      const irrSw = states['switch.' + dev + '_ctrl_irr'];
                      const shSw  = states['switch.' + dev + '_ctrl_short'];
                      if (cs === 'irrigation' && irrSw && irrSw.state === 'on') return 'var(--info-color, #2196F3)';
                      if (cs === 'short'      && shSw  && shSw.state  === 'on') return 'var(--warning-color, #FF9800)';
                      return 'var(--secondary-text-color)';
                    ]]]
              name:
                - font-size: 20px
                - font-weight: 500
                - justify-self: start
              label:
                - font-size: 15px
                - justify-self: start
                - width: 100%
            tap_action:
              action: none

          # Action Buttons
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: >-
                  [[[ return 'switch.' + states['input_text.irrigation_device_id'].state + '_ctrl_irr' ]]]
                name: Irr
                show_state: false
                icon: |
                  [[[
                    const dev = states['input_text.irrigation_device_id'].state;
                    const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                    const ft  = states['sensor.' + dev + '_status_fault'];
                    const lo = states['binary_sensor.' + dev + '_status_pump_lockout'];
                    const hardBlocked = (ml && ml.state === 'on') || (ft && ft.state && ft.state !== 'none' && ft.state.includes('io'));
                    const softBlocked = lo && lo.state === 'on';
                    if (hardBlocked || softBlocked || (entity && entity.state === 'on')) return 'mdi:stop';
                    return 'mdi:play';
                  ]]]
                styles:
                  card: [{padding: '10px 4px'}, {border-radius: 12px}]
                  icon: [{width: 26px}]
                  name: [{font-size: 15px}, {margin-top: 2px}]
                state:
                  - value: "on"
                    styles:
                      card: [{background: 'var(--info-color, #2196F3)'}]
                      icon: [{color: white}]
                      name: [{color: white}]
                  - value: "off"
                    styles:
                      card:
                        - background: |
                            [[[
                              const dev = states['input_text.irrigation_device_id'].state;
                              const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                              const ft  = states['sensor.' + dev + '_status_fault'];
                              const lo = states['binary_sensor.' + dev + '_status_pump_lockout'];
                              const hardBlocked = (ml && ml.state === 'on') || (ft && ft.state && ft.state !== 'none' && ft.state.includes('io'));
                              const softBlocked = lo && lo.state === 'on';
                              if (hardBlocked) return 'var(--error-color, #F44336)';
                              if (softBlocked) return 'var(--warning-color, #FF9800)';
                              return 'var(--card-background-color)';
                            ]]]
                      icon:
                        - color: |
                            [[[
                              const dev = states['input_text.irrigation_device_id'].state;
                              const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                              const ft  = states['sensor.' + dev + '_status_fault'];
                              const lo = states['binary_sensor.' + dev + '_status_pump_lockout'];
                              const hardBlocked = (ml && ml.state === 'on') || (ft && ft.state && ft.state !== 'none' && ft.state.includes('io'));
                              const softBlocked = lo && lo.state === 'on';
                              return (hardBlocked || softBlocked) ? 'white' : '';
                            ]]]
                      name:
                        - color: |
                            [[[
                              const dev = states['input_text.irrigation_device_id'].state;
                              const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                              const ft  = states['sensor.' + dev + '_status_fault'];
                              const lo = states['binary_sensor.' + dev + '_status_pump_lockout'];
                              const hardBlocked = (ml && ml.state === 'on') || (ft && ft.state && ft.state !== 'none' && ft.state.includes('io'));
                              const softBlocked = lo && lo.state === 'on';
                              return (hardBlocked || softBlocked) ? 'white' : '';
                            ]]]
                tap_action:
                  action: |
                    [[[
                      const dev = states['input_text.irrigation_device_id'].state;
                      const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                      const lo  = states['binary_sensor.' + dev + '_status_pump_lockout'];
                      const ft  = states['sensor.' + dev + '_status_fault'];
                      const blocked = (ml && ml.state==='on') || (lo && lo.state==='on')
                        || (ft && ft.state && ft.state!=='none' && ft.state.includes('io'));
                      return blocked ? 'none' : 'toggle';
                    ]]]
              - type: custom:button-card
                entity: >-
                  [[[ return 'switch.' + states['input_text.irrigation_device_id'].state + '_ctrl_short' ]]]
                name: Short
                show_state: false
                icon: |
                  [[[
                    const dev = states['input_text.irrigation_device_id'].state;
                    const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                    const ft  = states['sensor.' + dev + '_status_fault'];
                    const lo = states['binary_sensor.' + dev + '_status_pump_lockout'];
                    const hardBlocked = (ml && ml.state === 'on') || (ft && ft.state && ft.state !== 'none' && ft.state.includes('io'));
                    const softBlocked = lo && lo.state === 'on';
                    if (hardBlocked || softBlocked || (entity && entity.state === 'on')) return 'mdi:stop';
                    return 'mdi:play';
                  ]]]
                styles:
                  card: [{padding: '10px 4px'}, {border-radius: 12px}]
                  icon: [{width: 26px}]
                  name: [{font-size: 15px}, {margin-top: 2px}]
                state:
                  - value: "on"
                    styles:
                      card: [{background: 'var(--info-color, #2196F3)'}]
                      icon: [{color: white}]
                      name: [{color: white}]
                  - value: "off"
                    styles:
                      card:
                        - background: |
                            [[[
                              const dev = states['input_text.irrigation_device_id'].state;
                              const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                              const ft  = states['sensor.' + dev + '_status_fault'];
                              const lo = states['binary_sensor.' + dev + '_status_pump_lockout'];
                              const hardBlocked = (ml && ml.state === 'on') || (ft && ft.state && ft.state !== 'none' && ft.state.includes('io'));
                              const softBlocked = lo && lo.state === 'on';
                              if (hardBlocked) return 'var(--error-color, #F44336)';
                              if (softBlocked) return 'var(--warning-color, #FF9800)';
                              return 'var(--card-background-color)';
                            ]]]
                      icon:
                        - color: |
                            [[[
                              const dev = states['input_text.irrigation_device_id'].state;
                              const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                              const ft  = states['sensor.' + dev + '_status_fault'];
                              const lo = states['binary_sensor.' + dev + '_status_pump_lockout'];
                              const hardBlocked = (ml && ml.state === 'on') || (ft && ft.state && ft.state !== 'none' && ft.state.includes('io'));
                              const softBlocked = lo && lo.state === 'on';
                              return (hardBlocked || softBlocked) ? 'white' : '';
                            ]]]
                      name:
                        - color: |
                            [[[
                              const dev = states['input_text.irrigation_device_id'].state;
                              const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                              const ft  = states['sensor.' + dev + '_status_fault'];
                              const lo = states['binary_sensor.' + dev + '_status_pump_lockout'];
                              const hardBlocked = (ml && ml.state === 'on') || (ft && ft.state && ft.state !== 'none' && ft.state.includes('io'));
                              const softBlocked = lo && lo.state === 'on';
                              return (hardBlocked || softBlocked) ? 'white' : '';
                            ]]]
                tap_action:
                  action: |
                    [[[
                      const dev = states['input_text.irrigation_device_id'].state;
                      const ml  = states['switch.' + dev + '_zb_maintenance_lock'];
                      const lo  = states['binary_sensor.' + dev + '_status_pump_lockout'];
                      const ft  = states['sensor.' + dev + '_status_fault'];
                      const blocked = (ml && ml.state==='on') || (lo && lo.state==='on')
                        || (ft && ft.state && ft.state!=='none' && ft.state.includes('io'));
                      return blocked ? 'none' : 'toggle';
                    ]]]
              - type: custom:button-card
                entity: >-
                  [[[ return 'switch.' + states['input_text.irrigation_device_id'].state + '_ctrl_pause' ]]]
                name: Pause
                show_state: false
                icon: mdi:pause
                styles:
                  card: [{padding: '10px 4px'}, {border-radius: 12px}]
                  icon: [{width: 26px}]
                  name: [{font-size: 15px}, {margin-top: 2px}]
                state:
                  - value: "on"
                    styles:
                      card: [{background: 'var(--warning-color, #FF9800)'}]
                      icon: [{color: white}]
                      name: [{color: white}]
                  - value: "off"
                    styles:
                      card: [{background: 'var(--card-background-color)'}]
                tap_action:
                  action: toggle
              - type: custom:button-card
                name: Skip
                show_state: false
                icon: mdi:skip-next
                styles:
                  card: [{padding: '10px 4px'}, {border-radius: 12px}]
                  icon: [{width: 26px}]
                  name: [{font-size: 15px}, {margin-top: 2px}]
                tap_action:
                  action: call-service
                  service: switch.turn_on
                  target:
                    entity_id: >-
                      [[[ return 'switch.' + states['input_text.irrigation_device_id'].state + '_zb_skip' ]]]

          # Cycle Countdown
          - type: custom:button-card
            entity: >-
              [[[ return 'sensor.' + states['input_text.irrigation_device_id'].state + '_status_cycle_state' ]]]
            show_name: false
            show_state: false
            show_icon: false
            label: |
              [[[
                const dev   = states['input_text.irrigation_device_id'].state;
                const cs    = entity ? entity.state : 'none';
                const irrSw = states['switch.' + dev + '_ctrl_irr'];
                const shSw  = states['switch.' + dev + '_ctrl_short'];
                const running = (cs === 'irrigation' && irrSw && irrSw.state === 'on') || (cs === 'short' && shSw && shSw.state === 'on');
                const cr = states['sensor.' + dev + '_status_cycle_remaining'];
                const cycleName = running ? (cs === 'irrigation' ? 'Irrigation' : 'Short') : 'Idle';
                const rawTime = (running && cr && cr.state && cr.state !== '00:00') ? cr.state : null;
                let timeStr = '--:--:--';
                if (rawTime) {
                  const parts = rawTime.split(':');
                  timeStr = parts.length === 2 ? '00:' + rawTime : rawTime;
                }
                const color = running ? (cs === 'irrigation' ? 'var(--info-color, #2196F3)' : 'var(--warning-color, #FF9800)') : 'var(--secondary-text-color)';
                return '<div style="display:flex;align-items:center;gap:10px;padding:4px 0">'
                  + '<ha-icon icon="mdi:sprinkler-variant" style="--mdc-icon-size:22px;color:' + color + '"></ha-icon>'
                  + '<span style="flex:1;font-size:17px">' + cycleName + '</span>'
                  + '<span style="font-size:20px;font-weight:700;font-family:monospace;color:' + color + '">' + timeStr + '</span>'
                  + '</div>';
              ]]]
            show_label: true
            styles:
              card: [{padding: '6px 14px'}, {box-shadow: none}]
              label: [{text-align: left}]

          # Zone Countdown
          - type: custom:button-card
            entity: >-
              [[[ return 'sensor.' + states['input_text.irrigation_device_id'].state + '_status_active_zone' ]]]
            show_name: false
            show_state: false
            show_icon: false
            label: |
              [[[
                const dev = states['input_text.irrigation_device_id'].state;
                const zoneNum   = entity ? parseInt(entity.state) : 0;
                const zr        = states['sensor.' + dev + '_status_zone_remaining'];
                const zoneCount = parseInt(states['input_number.irrigation_zone_count'].state) || 15;
                let zoneName = 'No active zone';
                if (zoneNum > 0 && zoneNum <= zoneCount) {
                  const nameEnt = states['input_text.irrigation_zone_' + zoneNum + '_name'];
                  zoneName = nameEnt ? nameEnt.state : 'Zone ' + zoneNum;
                }
                const active  = zoneNum > 0;
                const timeStr = (active && zr && zr.state && zr.state !== '00:00') ? zr.state : '--:--';
                const color   = active ? 'var(--primary-color)' : 'var(--secondary-text-color)';
                return '<div style="display:flex;align-items:center;gap:10px;padding:4px 0">'
                  + '<ha-icon icon="mdi:pipe-valve" style="--mdc-icon-size:22px;color:' + color + '"></ha-icon>'
                  + '<span style="flex:1;font-size:17px">' + zoneName + '</span>'
                  + '<span style="font-size:20px;font-weight:700;font-family:monospace;color:' + color + '">' + timeStr + '</span>'
                  + '</div>';
              ]]]
            show_label: true
            styles:
              card: [{padding: '6px 14px'}, {box-shadow: none}]
              label: [{text-align: left}]

          # Schedule Display
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                show_name: false
                show_icon: false
                show_state: false
                show_label: false
                styles:
                  card: [{padding: '4px 6px'}, {border-top: '1px dotted var(--divider-color)'}]
                  grid:
                    - grid-template-areas: '"title" "s1" "s2"'
                    - grid-template-rows: auto auto auto
                    - grid-gap: 2px
                  custom_fields:
                    title: [{font-size: 13px}, {font-weight: 500}, {color: 'var(--secondary-text-color)'}, {justify-self: center}, {padding: '0 4px 2px'}]
                    s1: [{justify-self: stretch}]
                    s2: [{justify-self: stretch}]
                tap_action:
                  action: none
                custom_fields:
                  title: Irrigation
                  s1:
                    card:
                      type: custom:button-card
                      entity: >-
                        [[[ return 'switch.' + states['input_text.irrigation_device_id'].state + '_cycle_irr_schedule_1_enable' ]]]
                      show_name: false
                      show_icon: false
                      show_state: false
                      show_label: true
                      label: |
                        [[[
