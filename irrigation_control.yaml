# ============================================================================
# ESP32-C6 Zigbee Irrigation Controller - ESPHome Configuration v1.1.2 
# ============================================================================
# Device: kutvezerles
# Board: ESP32-C6-DevKitC-1 default
# Flash: 4MB
# Communication: Zigbee
# Integration: Home Assistant via Zigbee2MQTT
# ============================================================================
# Known bugs: see docs - Irrigation/TODO list.md
# ============================================================================

substitutions:
  device_name: irrigation-control
  friendly_name: "Irrigation controller"
  # Timezone for the_time platforms. RTC uses UTC internally (see schedules.yaml).
  timezone: "Europe/Budapest"
  # Devboard definitions. Supported: c6-devkitc-1: Untested: xiao_esp32c6
  dev_board: "c6-devkitc-1" 
  zones: "11"    # Supported: 7 / 11 / 15
  language: "en" # Supported: hu / en
  # Zone names can be customized is irrigation_control/zones/zone_config_#.h.


# ============================================================================
# Core ESPHome Configuration
# ============================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
  includes:
    - irrigation_control/zones/zone_config_${zones}.h
    - irrigation_control/translations/config_${language}.h
    - irrigation_control/config.h
    - irrigation_control/helpers.h
    - irrigation_control/display.h
  on_boot:
  - priority: 600
    then:
      - logger.log: "System booting..."
      - script.execute: set_system_time_on_boot
  - priority: -100
    then:
      # RGB LED init: WS2812 RMT driver not ready at priority 600.
      - lambda: 'id(rgb_ready) = true;'
      - script.execute: rgb_update_state
      - script.execute: check_power_loss_on_boot


preferences:
  flash_write_interval: 10s  # Lifetime analysis: ~34 years at scenario usage (150 irr days/year,
                              # 3 cycles/day, 30 transitions/cycle). Dominant write is
                              # daily_water_time_sec (1/min while zones active). Interval value
                              # does not affect write count — only batching within the window.

external_components:
  - source:
      type: git
      url: https://github.com/luar123/zigbee_esphome
      ref: v1.x
    components: [ zigbee ]
    refresh: 1d
  # Minimum ESPHome version: 2026.4.0

logger:
  level: INFO #DEBUG
#  hardware_uart: UART0 #activate for logging on GPIO16/17
  logs:
    component: ERROR

# ============================================================================
# Packages (split files)
# ============================================================================

packages:
  hardware:         !include irrigation_control/boards/hardware_${dev_board}.yaml
  relays:           !include irrigation_control/zones/relays_${zones}.yaml
  zigbee_zone_ep:   !include irrigation_control/zones/zigbee_zone_endpoints_${zones}.yaml
  zigbee_global_ep: !include irrigation_control/zigbee_global_endpoints.yaml
  globals:          !include irrigation_control/globals.yaml
  scripts_system:   !include irrigation_control/scripts_system.yaml
  scripts_buttons:  !include irrigation_control/scripts_buttons.yaml
  scripts_manual:   !include irrigation_control/scripts_manual.yaml
  scripts_cycles:   !include irrigation_control/scripts_cycles.yaml
  schedules:        !include irrigation_control/schedules.yaml
  ui_glyphs:        !include irrigation_control/glyphs.yaml
