# ============================================================================
# zones/zigbee_zone_endpoints_7.yaml  —  7-zone ZB endpoint definitions
# ============================================================================
# Zone endpoints EP 1-7 using cluster 0xFFF0.
# Global endpoints (EP 8/9/10) are in zigbee_global_endpoints.yaml
# which must include the zigbee: id: zb header.
# ============================================================================

zigbee:
  id: zb

  endpoints:

    # -------------------------------------------------------------------------
    # Zone 1
    # -------------------------------------------------------------------------
    - device_type: ON_OFF_OUTPUT
      num: 1
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0
              type: bool
              report: true
              device: zone1_zb
              on_value:
                then:
                  - lambda: 'if (id(zb_internal_sync)) return;'
                  - if:
                      condition:
                        lambda: 'return x;'
                      then:
                        - if:
                            condition:
                              lambda: 'return id(cycle_running) && id(current_cycle_num) != 0;'
                            then:
                              - lambda: 'id(zb_target_zone) = 1;'
                              - script.execute: jump_to_zone_in_cycle
                            else:
                              - lambda: 'id(manual_zone_selected) = 1;'
                              - script.execute: start_single_zone_manual
                      else:
                        - if:
                            condition:
                              lambda: 'return id(cycle_running) && id(current_cycle_num) != 0 && id(current_zone_num) == 1;'
                            then:
                              - script.execute: skip_zone_script
                            else:
                              - script.execute: stop_single_zone_manual
        - id: 0xFFF0
          attributes:
            - id: z1_irr
              attribute_id: 0x0001
              type: U8
              access: READ_WRITE
              value: 15
              report: true
              on_value:
                then:
                  - lambda: 'if (x > 60) return; g_config.zones[0].irr_duration_min = (uint8_t)x; config_save(); id(update_next_schedule_display).execute();'
            - id: z1_short
              attribute_id: 0x0002
              type: U8
              access: READ_WRITE
              value: 10
              report: true
              on_value:
                then:
                  - lambda: 'if (x > 60) return; g_config.zones[0].short_duration_min = (uint8_t)x; config_save(); id(update_next_schedule_display).execute();'
            - id: z1_manual
              attribute_id: 0x0003
              type: U8
              access: READ_WRITE
              value: 5
              report: true
              on_value:
                then:
                  - lambda: 'if (x > 60) return; g_config.zones[0].manual_duration_min = (uint8_t)x; config_save();'
            - id: z1_flags
              attribute_id: 0x0004
              type: U8
              access: READ_WRITE
              value: 3
              report: true
              on_value:
                then:
                  - lambda: 'g_config.zones[0].flags = (uint8_t)x; config_save(); id(update_next_schedule_display).execute();'

