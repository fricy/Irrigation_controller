# ============================================================================
# zones/relays_11.yaml  —  11-zone relay and switch definitions
# ============================================================================
# Pump relay: PA7 (MCP23017 pin 7)
# Zone relays: PA6-PA0 (Zones 1-7), PB4-PB7 (Zones 8-11)
# Includes: pump relay, zone relays, zone ZB template switches,
#           cycle template switches (irrigation_cycle_active, short_cycle_active)
# ============================================================================

switch:
  - platform: gpio
    id: pump_relay
    name: "Pump"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 7, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(pump_start_time) = millis();
          ESP_LOGI("pump", "Pump started");
          if (id(rgb_ready)) id(rgb_update_state).execute();
    on_turn_off:
      - lambda: |-
          id(pump_last_stop_time) = millis();
          ESP_LOGI("pump", "Pump stopped");
          if (id(rgb_ready)) id(rgb_update_state).execute();

  - platform: gpio
    id: zone1_relay
    name: "Zone 1"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 6, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: &zone_interlock [zone1_relay, zone2_relay, zone3_relay, zone4_relay, zone5_relay, zone6_relay, zone7_relay, zone8_relay, zone9_relay, zone10_relay, zone11_relay]
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: gpio
    id: zone2_relay
    name: "Zone 2"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 5, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: *zone_interlock
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: gpio
    id: zone3_relay
    name: "Zone 3"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 4, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: *zone_interlock
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: gpio
