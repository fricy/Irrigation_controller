  # Cycle state switches — bound to ZB EP 12/13, driven by scripts only
  - platform: template
    id: irrigation_cycle_active
    name: "Irrigation Cycle Active"
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: short_cycle_active
    name: "Short Cycle Active"
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

