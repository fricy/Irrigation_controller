# ============================================================================
# zones/relays_7.yaml  —  7-zone relay and switch definitions
# ============================================================================
# Pump relay: PA7 (MCP23017 pin 7)
# Zone relays: PA6-PA0 (Zones 1-7)
# ============================================================================

switch:
  - platform: gpio
    id: pump_relay
    name: "Pump"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 7, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(pump_start_time) = millis();
          ESP_LOGI("pump", "Pump started");
          if (id(rgb_ready)) id(rgb_update_state).execute();
    on_turn_off:
      - lambda: |-
          id(pump_last_stop_time) = millis();
          ESP_LOGI("pump", "Pump stopped");
          if (id(rgb_ready)) id(rgb_update_state).execute();

  - platform: gpio
    id: zone1_relay
    name: "Zone 1"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 6, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: &zone_interlock [zone1_relay, zone2_relay, zone3_relay, zone4_relay, zone5_relay, zone6_relay, zone7_relay]
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: gpio
    id: zone2_relay
    name: "Zone 2"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 5, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: *zone_interlock
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: gpio
    id: zone3_relay
    name: "Zone 3"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 4, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: *zone_interlock
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: gpio
    id: zone4_relay
    name: "Zone 4"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 3, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: *zone_interlock
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: gpio
    id: zone5_relay
    name: "Zone 5"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 2, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: *zone_interlock
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: gpio
    id: zone6_relay
    name: "Zone 6"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 1, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: *zone_interlock
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: gpio
    id: zone7_relay
    name: "Zone 7"
    internal: true
    pin: { mcp23xxx: mcp23017_hub, number: 0, mode: { output: true } }
    restore_mode: ALWAYS_OFF
    interlock: *zone_interlock
    interlock_wait_time: 100ms
    on_turn_off:
      then: { script.execute: zone_end_pulse }

  - platform: template
    id: irrigation_cycle_active
    name: "Irrigation Cycle Active"
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: short_cycle_active
    name: "Short Cycle Active"
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: zone1_zb
    name: "Zone 1 ZB"
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: zone2_zb
    name: "Zone 2 ZB"
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: zone3_zb
    name: "Zone 3 ZB"
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: zone4_zb
    name: "Zone 4 ZB"
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: zone5_zb
    name: "Zone 5 ZB"
    internal: true
