  - file:
      type: gfonts
      family: Roboto
      weight: 300
    id: font_header
    size: 12
    glyphsets:
      - GF_Latin_Core
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: Roboto
      weight: 600
    id: font_main
    size: 15
    glyphsets:
      - GF_Latin_Core
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_footer
    size: 16
    glyphsets:
      - GF_Latin_Core
    ignore_missing_glyphs: true

