# ============================================================================
# Hardware: I2C, Display, MCP23017, Outputs, Lights, Buttons, Relays, Sensors
# ============================================================================
# v0.9.1 hardware revision — new PCB
#
# GPIO assignments (ESP32-C6):
#   GPIO00  SDA  (I2C: SH1107, DS3231, MCP23017)
#   GPIO01  SCL  (I2C: SH1107, DS3231, MCP23017)
#   GPIO07  MCP23017 RESET — disconnected, MCP /RESET pulled to VCC via 10K
#   GPIO02  ADC  (reserved — see docs/current_sensor_archived.md)
#   GPIO08  WS2812 RGB LED (stage 3)
#   GPIO18  Button 1 LED
#   GPIO19  Button 1
#   GPIO20  Button 2 LED
#   GPIO21  Button 2
#   GPIO22  Button 3 LED
#   GPIO23  Button 3
#
# MCP23017 (0x20) pin assignments:
#   PA7 (pin 7)  Zone 1 relay
#   PA6 (pin 6)  Zone 2 relay
#   PA5 (pin 5)  Zone 3 relay
#   PA4 (pin 4)  Zone 4 relay
#   PA3 (pin 3)  Zone 5 relay
#   PA2 (pin 2)  Zone 6 relay
#   PA1 (pin 1)  Zone 7 relay
#   PA0 (pin 0)  Zone 8 relay
#   PB4 (pin 12) Zone 9 relay
#   PB5 (pin 13) Zone 10 relay
#   PB6 (pin 14) Zone 11 relay
#   PB7 (pin 15) Pump relay
#
# ============================================================================

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y
      CONFIG_FREERTOS_UNICORE: n

# ============================================================================
# I2C
# ============================================================================

i2c:
  sda: GPIO00
  scl: GPIO01
  scan: true
  id: i2c_bus
  frequency: 400kHz

mcp23017:
  - id: mcp23017_hub
    address: 0x20
    i2c_id: i2c_bus
    # setup_priority ensures MCP is initialized before relay switches attempt
    # restore_mode calls during ESPHome boot sequence.

# ============================================================================
# Display
# ============================================================================

font:
