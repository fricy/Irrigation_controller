                  - lambda: 'if (id(zb_internal_sync)) return;'
                  - if:
                      condition:
                        lambda: 'return x;'
                      then:
                        - if:
                            condition:
                              lambda: 'return id(cycle_running) && id(current_cycle_num) != 0;'
                            then:
                              - lambda: 'id(zb_target_zone) = 11;'
                              - script.execute: jump_to_zone_in_cycle
                            else:
                              - lambda: 'id(manual_zone_selected) = 11;'
                              - script.execute: start_single_zone_manual
                      else:
                        - if:
                            condition:
                              lambda: 'return id(cycle_running) && id(current_cycle_num) != 0 && id(current_zone_num) == 11;'
                            then:
                              - script.execute: skip_zone_script
                            else:
                              - script.execute: stop_single_zone_manual
        - id: 0xFFF0
          attributes:
            - id: z11_irr
              attribute_id: 0x0001
              type: U8
              access: READ_WRITE
              value: 0
              report: true
              on_value:
                then:
                  - lambda: 'g_config.zones[10].irr_duration_min = (uint8_t)x; config_save();'
            - id: z11_short
              attribute_id: 0x0002
              type: U8
              access: READ_WRITE
              value: 0
              report: true
              on_value:
                then:
                  - lambda: 'g_config.zones[10].short_duration_min = (uint8_t)x; config_save();'
            - id: z11_manual
              attribute_id: 0x0003
              type: U8
              access: READ_WRITE
              value: 5
              report: true
              on_value:
                then:
                  - lambda: 'g_config.zones[10].manual_duration_min = (uint8_t)x; config_save();'
            - id: z11_flags
              attribute_id: 0x0004
              type: U8
              access: READ_WRITE
              value: 0
              report: true
              on_value:
                then:
                  - lambda: 'g_config.zones[10].flags = (uint8_t)x; config_save();'
