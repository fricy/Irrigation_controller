# ============================================================================
# Zigbee Endpoints EP 1-11 (Zone control + config)
# ============================================================================
# Zone endpoints use template switches (zoneN_zb) via device: binding.
# Incoming commands handled by on_value; hardware not touched directly.
# zb_internal_sync guard suppresses feedback loop from sync calls.
#
# Custom cluster 0xFFF0 on EP 1-11: per-zone config (durations + flags)
#   id naming: z{N}_irr, z{N}_short, z{N}_manual, z{N}_flags
#   0x0001: irr_duration_min    U8  minutes (0=disabled)
#   0x0002: short_duration_min  U8  minutes (0=disabled)
#   0x0003: manual_duration_min U8  minutes
#   0x0004: flags               U8  bit0=irr_enabled bit1=short_enabled
#
# Default values per zone:
#   Zones 1-5, 7-8: irr=15 short=10 manual=5 flags=3 (wired, in cycle)
#   Zone 6:         irr=0  short=0  manual=0 flags=0 (not wired)
#   Zone 9-10:      irr=0  short=0  manual=0 flags=0 (not wired)
#   Zone 11:        irr=0  short=0  manual=5 flags=0 (manual only)
# ============================================================================

zigbee:
  id: zb
  manufacturer: "Custom"
  on_join:
    then:
      - logger.log: "Joined Zigbee network"
      - lambda: 'id(zigbee_connected) = true;'

  endpoints:
    # -------------------------------------------------------------------------
    # Zone 1 (wired, in cycle)
    # -------------------------------------------------------------------------
    - device_type: ON_OFF_OUTPUT
      num: 1
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0
              type: bool
              report: true
              device: zone1_zb
              on_value:
                then:
                  - lambda: 'if (id(zb_internal_sync)) return;'
                  - if:
                      condition:
                        lambda: 'return x;'
                      then:
                        - if:
                            condition:
                              lambda: 'return id(cycle_running) && id(current_cycle_num) != 0;'
                            then:
                              - lambda: 'id(zb_target_zone) = 1;'
                              - script.execute: jump_to_zone_in_cycle
                            else:
                              - lambda: 'id(manual_zone_selected) = 1;'
                              - script.execute: start_single_zone_manual
                      else:
                        - if:
                            condition:
                              lambda: 'return id(cycle_running) && id(current_cycle_num) != 0 && id(current_zone_num) == 1;'
                            then:
                              - script.execute: skip_zone_script
                            else:
                              - script.execute: stop_single_zone_manual
        - id: 0xFFF0
          attributes:
            - id: z1_irr
              attribute_id: 0x0001
              type: U8
              access: READ_WRITE
              value: 15
              report: true
              on_value:
                then:
                  - lambda: 'g_config.zones[0].irr_duration_min = (uint8_t)x; config_save();'
            - id: z1_short
              attribute_id: 0x0002
              type: U8
              access: READ_WRITE
              value: 10
              report: true
              on_value:
                then:
                  - lambda: 'g_config.zones[0].short_duration_min = (uint8_t)x; config_save();'
                  - zigbee.report: zb
            - id: z1_manual
              attribute_id: 0x0003
              type: U8
              access: READ_WRITE
              value: 5
              report: true
              on_value:
                then:
                  - lambda: 'g_config.zones[0].manual_duration_min = (uint8_t)x; config_save();'
            - id: z1_flags
              attribute_id: 0x0004
              type: U8
              access: READ_WRITE
              value: 3
              report: true
              on_value:
                then:
                  - lambda: 'g_config.zones[0].flags = (uint8_t)x; config_save();'

