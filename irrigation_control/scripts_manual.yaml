# ============================================================================
# Manual Zone Scripts
# ============================================================================
# sync_zone_zb_state       - moved to scripts_system.yaml (used by boot push too)
# pump_start_sequence      - pump/valve start ordering (cycle start + manual start only)
# pump_stop_sequence       - pump/valve stop ordering (cycle end + manual stop only)
# start_single_zone_manual - start a zone in manual mode
# stop_single_zone_manual  - stop the currently running manual zone (user abort)
# ============================================================================

script:
  - id: pump_start_sequence
    then:
      - if:
          condition:
            lambda: 'return g_config.pump_start_offset >= 0;'
          then:
            - if:
                condition:
                  lambda: 'return g_config.pump_start_offset > 0;'
                then:
                  - delay: !lambda 'return (uint32_t)g_config.pump_start_offset * 1000;'
            - if:
                condition:
                  lambda: 'return id(cycle_running);'
                then:
                  - switch.turn_on: pump_relay
          else:
            - switch.turn_on: pump_relay
            - delay: !lambda 'return (uint32_t)(-g_config.pump_start_offset) * 1000;'
            - if:
                condition:
                  lambda: 'return id(cycle_running);'
                then:
                  - lambda: 'zone_relay_on(id(pump_seq_zone));'

  - id: pump_stop_sequence
    then:
      - if:
          condition:
            lambda: 'return g_config.pump_stop_offset <= 0;'
          then:
            - if:
                condition:
                  lambda: 'return g_config.pump_stop_offset < 0;'
                then:
                  - delay: !lambda 'return (uint32_t)(-g_config.pump_stop_offset) * 1000;'
            - switch.turn_off: pump_relay
          else:
            - switch.turn_off: pump_relay
            - delay: !lambda 'return (uint32_t)g_config.pump_stop_offset * 1000;'
            - lambda: 'if (id(pump_stop_zone) > 0) zone_relay_off(id(pump_stop_zone));'

  - id: start_single_zone_manual
    then:
      - lambda: |-
          int zone = id(manual_zone_selected);
          if (id(io_fault)) {
            ESP_LOGW("manual", "Manual zone blocked: io_fault");
            id(display_page) = PAGE_PUMP_FAULT;
            // Push all zone EPs back to OFF so Z2M reflects rejected state.
            id(zb_sync_zone) = 0;
            id(sync_zone_zb_state).execute();
            return;
          }
          if (!id(irrigation_allowed).state) {
            ESP_LOGW("manual", "Manual zone blocked: maintenance");
            id(display_page) = PAGE_PUMP_FAULT;
            id(zb_sync_zone) = 0;
            id(sync_zone_zb_state).execute();
            return;
          }
          int dur  = zone_manual_duration_sec(zone);
          ESP_LOGI("manual", "Starting zone %d (%ds)", zone, dur);
          // Clear power loss warning if showing - device operates normally
          id(power_loss_detected) = false;
          id(manual_zone_mode)   = true;
          id(cycle_running)      = true;
          id(current_cycle_num)  = 0;
          id(current_zone_num)   = zone;
          id(zone_remaining_sec) = dur;
          id(current_zone_name)  = zone_name(zone);
          id(pump_seq_zone)      = zone;
          id(zb_sync_zone) = zone;
          id(sync_zone_zb_state).execute();
          id(zb_push_zone_start).execute();
          if (g_config.pump_start_offset >= 0)
            zone_relay_on(zone);
          id(display_page) = PAGE_MANUAL_RUNNING;
          id(cycle_start_pattern).execute();
      - script.execute: pump_start_sequence
      - script.execute: zone_countdown_timer

  - id: stop_single_zone_manual
    then:
      - lambda: |-
          ESP_LOGI("manual", "Stopping zone %d (manual abort)", id(current_zone_num));
          id(cycle_running) = false;
          id(pump_stop_zone) = id(current_zone_num);
          if (g_config.pump_stop_offset <= 0)
            zone_relay_off(id(current_zone_num));
      - script.execute: pump_stop_sequence
      - if:
          condition:
            lambda: 'return g_config.pump_stop_offset > 0;'
          then:
            - delay: !lambda 'return (uint32_t)g_config.pump_stop_offset * 1000;'
      - lambda: |-
          id(manual_zone_mode)  = false; id(cycle_running)      = false;
          id(current_cycle_num) = 0;     id(current_zone_num)   = 0;
          id(zone_remaining_sec) = 0;
          id(zb_sync_zone) = 0; id(sync_zone_zb_state).execute();
          id(zb_push_cycle_state_zero).execute();
          id(zb_push_cycle_genOnOff).execute();
          id(display_page) = PAGE_IDLE;
          id(rgb_update_state).execute();
          id(cycle_end_pattern).execute();
          id(start_queued_cycle_script).execute();
