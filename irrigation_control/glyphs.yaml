# ============================================================================
# Fonts and Icons
# ============================================================================

font:
  # Text fonts
  - file:
      type: gfonts
      family: Roboto
      weight: 300
    id: font_header
    size: 12
    glyphsets:
      - GF_Latin_Core
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: Roboto
      weight: 600
    id: font_main
    size: 15
    glyphsets:
      - GF_Latin_Core
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_footer
    size: 16
    glyphsets:
      - GF_Latin_Core
    ignore_missing_glyphs: true

  # Icon fonts - Material Symbols Outlined
  # Glyphs used (by codepoint):
  #   ef16 network_wifi (connected)   e1da wifi_off (disconnected)
  #   e855 event/schedule             e856 alarm_add
  #   e857 alarm off                  e8b5 clock
  #   e037 play_arrow (start)         e047 stop
  #   e034 pause                      e044 skip_next
  #   f7d0 resume                     e16d queue
  #   e31b done/ok                    e5cd cancel/close
  #   e314 chevron_left               e315 chevron_right
  #   e316 keyboard_arrow_up          e313 keyboard_arrow_down
  #   f1fe check (enabled)            e224 water/valve
  #   e29a sprinkler                  f5d8 pump
  #   ea3c handyman/maintenance       eb58 percent
  #   e040 repeat                     e869 settings
  #   f7ea battery error              f16f reboot
  #   e646 power_off (power loss)     e3c9 edit
  #   e002 warning                    f3dd add/plus
  #   e15b remove/minus               e161 save
  #   e1c3 screensaver                eb76 night off
  #   e1e2 network                    e2bd weather
  #   f172 sunny                      f176 rainy
   
  - file:
      type: gfonts
      family: Material Symbols Outlined
      weight: 400
    id: font_icons_header
    size: 12
    glyphs: "\U0000EF16\U0000E1DA\U0000E855\U0000E856\U0000E037\U0000E047\U0000E034\U0000E044\U0000E31B\U0000E5CD\U0000E314\U0000E315\U0000E316\U0000E313\U0000F1FE\U0000E224\U0000E29A\U0000F5D8\U0000EA3C\U0000EB58\U0000E040\U0000E869\U0000E646\U0000E3C9\U0000E002\U0000F3DD\U0000E15B\U0000F1C0\U0000E16D\U0000F7d0\U0000E161\U0000F7EA\U0000F16F\U0000E1C3\U0000EB76\U0000E1E2\U0000F176\U0000E8B5\U0000E857\U0000E2BD\U0000F172"
  - file:
      type: gfonts
      family: Material Symbols Outlined
      weight: 600
    id: font_icons_main
    size: 15
    glyphs: "\U0000EF16\U0000E1DA\U0000E855\U0000E856\U0000E037\U0000E047\U0000E034\U0000E044\U0000E31B\U0000E5CD\U0000E314\U0000E315\U0000E316\U0000E313\U0000F1FE\U0000E224\U0000E29A\U0000F5D8\U0000EA3C\U0000EB58\U0000E040\U0000E869\U0000E646\U0000E3C9\U0000E002\U0000F3DD\U0000E15B\U0000F1C0\U0000E16D\U0000F7d0\U0000E161\U0000F7EA\U0000F16F\U0000E1C3\U0000EB76\U0000E1E2\U0000F176\U0000E8B5\U0000E857\U0000E2BD\U0000F172"
  - file:
      type: gfonts
      family: Material Symbols Outlined
      weight: 600
    id: font_icons_footer
    size: 18
    glyphs: "\U0000EF16\U0000E1DA\U0000E855\U0000E856\U0000E037\U0000E047\U0000E034\U0000E044\U0000E31B\U0000E5CD\U0000E314\U0000E315\U0000E316\U0000E313\U0000F1FE\U0000E224\U0000E29A\U0000F5D8\U0000EA3C\U0000EB58\U0000E040\U0000E869\U0000E646\U0000E3C9\U0000E002\U0000F3DD\U0000E15B\U0000F1C0\U0000E16D\U0000F7d0\U0000E161\U0000F7EA\U0000F16F\U0000E1C3\U0000EB76\U0000E1E2\U0000F176\U0000E8B5\U0000E857\U0000E2BD\U0000F172"
